{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wanderlust - Premium Travel & Tours. Curated luxury journeys to the world's most extraordinary destinations.">
    <title>Wanderlust - Premium Travel & Tours | Book Your Adventure</title>
    
    <!-- React & ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- For JSX compilation (Babel) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #0A0F2C; color: #F8F4EE; }
        :root {
            --navy: #0A0F2C;
            --navy2: #131a3d;
            --gold: #D4A853;
            --gold2: #e8c070;
            --ivory: #F8F4EE;
            --teal: #00B4A6;
            --teal2: #00d4c4;
            --muted: rgba(248,244,238,0.55);
            --border: rgba(212,168,83,0.18);
            --glass: rgba(255,255,255,0.04);
        }
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--navy); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }
        
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 0 5vw;
            display: flex; align-items: center; justify-content: space-between;
            height: 72px;
            transition: background 0.4s, backdrop-filter 0.4s, border-bottom 0.4s;
        }
        .nav.scrolled {
            background: rgba(10,15,44,0.92);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }
        .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: var(--gold); letter-spacing: 1px; cursor:pointer; }
        .nav-links { display: flex; gap: 36px; align-items: center; }
        .nav-link { color: var(--muted); font-size: 14px; font-weight: 400; letter-spacing: 0.5px; cursor: pointer; transition: color 0.2s; text-decoration: none; }
        .nav-link:hover { color: var(--ivory); }
        .nav-btns { display: flex; gap: 12px; align-items: center; }
        .btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 20px; border-radius: 2px; font-family: 'DM Sans'; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
        .btn-gold { background: var(--gold); border: none; color: var(--navy); padding: 9px 22px; border-radius: 2px; font-family: 'DM Sans'; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-gold:hover { background: var(--gold2); }
        
        .hero {
            min-height: 100vh;
            background: linear-gradient(160deg, #0A0F2C 0%, #0d1535 40%, #0e1a3a 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 120px 5vw 80px;
            position: relative; overflow: hidden;
        }
        .hero-bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; }
        .hero-eyebrow { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--teal); font-weight: 400; margin-bottom: 20px; }
        .hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(52px, 8vw, 96px); font-weight: 300; line-height: 1.05; color: var(--ivory); margin-bottom: 24px; }
        .hero-title em { font-style: italic; color: var(--gold); }
        .hero-sub { font-size: 16px; color: var(--muted); max-width: 520px; line-height: 1.7; margin-bottom: 52px; font-weight: 300; }
        
        .search-bar {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 4px;
            display: flex; align-items: stretch; width: 100%; max-width: 760px;
            backdrop-filter: blur(12px); overflow: hidden;
        }
        .search-field { flex: 1; padding: 18px 22px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
        .search-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); }
        .search-input { background: none; border: none; outline: none; color: var(--ivory); font-family: 'DM Sans'; font-size: 14px; width: 100%; }
        .search-input::placeholder { color: rgba(248,244,238,0.3); }
        .search-btn { background: var(--gold); border: none; padding: 0 32px; color: var(--navy); font-family: 'DM Sans'; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .search-btn:hover { background: var(--gold2); }
        
        .stats-bar { display: flex; gap: 60px; margin-top: 64px; }
        .stat-item { text-align: center; }
        .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--ivory); }
        .stat-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
        
        .section { padding: 100px 5vw; }
        .section-dark { background: #070b1e; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 52px; }
        .section-eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; }
        .section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 4vw, 50px); font-weight: 300; color: var(--ivory); line-height: 1.1; }
        .section-title em { font-style: italic; color: var(--gold); }
        .view-all { color: var(--gold); font-size: 13px; font-weight: 400; cursor: pointer; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 2px; white-space: nowrap; }
        
        .dest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .dest-card { border-radius: 4px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid var(--border); transition: transform 0.3s, border-color 0.3s; height: 380px; }
        .dest-card:hover { transform: translateY(-6px); border-color: rgba(212,168,83,0.4); }
        .dest-emoji-bg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 72px; }
        .dest-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,11,30,0.92) 0%, rgba(7,11,30,0.3) 50%, transparent 100%); }
        .dest-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px; }
        .dest-country { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); margin-bottom: 6px; }
        .dest-name { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 400; color: var(--ivory); margin-bottom: 8px; }
        .dest-meta { display: flex; gap: 16px; }
        .dest-tag { font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.08); padding: 3px 10px; border-radius: 2px; }
        .dest-rating { margin-left: auto; font-size: 13px; color: var(--gold); font-weight: 500; }
        
        .pkg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 28px; }
        .pkg-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; transition: transform 0.3s, border-color 0.3s; cursor: pointer; }
        .pkg-card:hover { transform: translateY(-4px); border-color: rgba(212,168,83,0.35); }
        .pkg-img-wrap { position: relative; height: 220px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .pkg-ribbon { position: absolute; top: 16px; right: 0; background: var(--gold); color: var(--navy); padding: 5px 16px 5px 12px; font-size: 12px; font-weight: 500; clip-path: polygon(8px 0%, 100% 0%, 100% 100%, 8px 100%, 0% 50%); }
        .pkg-badge { position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: var(--ivory); font-size: 11px; padding: 4px 10px; border-radius: 2px; backdrop-filter: blur(8px); letter-spacing: 1px; }
        .pkg-body { padding: 22px; }
        .pkg-dest { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; }
        .pkg-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--ivory); margin-bottom: 12px; line-height: 1.2; }
        .pkg-info { display: flex; gap: 20px; margin-bottom: 18px; }
        .pkg-info-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
        .pkg-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--border); }
        .pkg-price-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
        .pkg-price-val { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--gold); }
        .pkg-price-per { font-size: 12px; color: var(--muted); }
        .btn-book { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 9px 20px; border-radius: 2px; font-family: 'DM Sans'; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-book:hover { background: var(--gold); color: var(--navy); }
        
        .hiw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; position: relative; }
        .hiw-connector { position: absolute; top: 36px; left: calc(33.33% - 10px); right: calc(33.33% - 10px); height: 1px; background: linear-gradient(90deg, var(--teal), var(--gold), var(--teal)); opacity: 0.3; }
        .hiw-card { text-align: center; padding: 40px 28px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 4px; }
        .hiw-icon { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, rgba(0,180,166,0.15), rgba(212,168,83,0.15)); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 24px; }
        .hiw-step { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; }
        .hiw-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--ivory); margin-bottom: 12px; }
        .hiw-desc { font-size: 14px; color: var(--muted); line-height: 1.7; font-weight: 300; }
        
        .testi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .testi-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 4px; padding: 28px; transition: border-color 0.3s; }
        .testi-card:hover { border-color: rgba(212,168,83,0.3); }
        .testi-stars { color: var(--gold); font-size: 14px; margin-bottom: 16px; letter-spacing: 2px; }
        .testi-text { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 300; font-style: italic; color: var(--ivory); line-height: 1.6; margin-bottom: 20px; }
        .testi-footer { display: flex; align-items: center; gap: 14px; }
        .testi-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), var(--gold)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--navy); }
        .testi-name { font-size: 14px; font-weight: 500; color: var(--ivory); }
        .testi-dest { font-size: 12px; color: var(--teal); margin-top: 2px; }
        
        .newsletter { text-align: center; padding: 100px 5vw; background: linear-gradient(135deg, #0d1535, #0a1a2e); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .newsletter-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 4vw, 52px); font-weight: 300; color: var(--ivory); margin-bottom: 16px; }
        .newsletter-sub { font-size: 15px; color: var(--muted); margin-bottom: 40px; font-weight: 300; }
        .newsletter-form { display: flex; gap: 0; max-width: 480px; margin: 0 auto; }
        .nl-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-right: none; padding: 14px 20px; color: var(--ivory); font-family: 'DM Sans'; font-size: 14px; outline: none; border-radius: 2px 0 0 2px; }
        .nl-input::placeholder { color: rgba(248,244,238,0.3); }
        .nl-btn { background: var(--gold); border: none; padding: 14px 28px; color: var(--navy); font-family: 'DM Sans'; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 0 2px 2px 0; transition: background 0.2s; }
        .nl-btn:hover { background: var(--gold2); }
        
        .footer { background: #050814; padding: 60px 5vw 30px; }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; margin-bottom: 48px; }
        .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: var(--gold); margin-bottom: 16px; }
        .footer-desc { font-size: 13px; color: var(--muted); line-height: 1.7; font-weight: 300; max-width: 280px; }
        .footer-social { display: flex; gap: 10px; margin-top: 20px; }
        .social-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 2px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 13px; transition: all 0.2s; }
        .social-btn:hover { border-color: var(--gold); color: var(--gold); }
        .footer-col-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; }
        .footer-link { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; cursor: pointer; transition: color 0.2s; text-decoration: none; }
        .footer-link:hover { color: var(--ivory); }
        .footer-bottom { border-top: 1px solid var(--border); padding-top: 24px; display: flex; justify-content: space-between; align-items: center; }
        .footer-copy { font-size: 12px; color: rgba(248,244,238,0.3); }
        
        /* Chat FAB */
        .chat-fab { position: fixed; bottom: 28px; right: 28px; z-index: 200; width: 56px; height: 56px; border-radius: 50%; background: var(--gold); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(212,168,83,0.35); transition: transform 0.2s, box-shadow 0.2s; font-size: 20px; }
        .chat-fab:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(212,168,83,0.45); }
        .chat-fab-pulse { position: fixed; bottom: 28px; right: 28px; z-index: 199; width: 56px; height: 56px; border-radius: 50%; background: rgba(212,168,83,0.3); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
        
        .chat-window { position: fixed; bottom: 96px; right: 28px; z-index: 200; width: 380px; max-height: 560px; background: rgba(10,15,44,0.97); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.6); animation: slideUp 0.25s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .chat-header { padding: 16px 20px; background: linear-gradient(135deg, rgba(212,168,83,0.12), rgba(0,180,166,0.08)); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .chat-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), var(--gold)); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; color: var(--navy); font-weight: 600; }
        .chat-header-name { font-size: 14px; font-weight: 500; color: var(--ivory); }
        .chat-header-status { font-size: 11px; color: var(--teal); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); display: inline-block; }
        .chat-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px; line-height: 1; margin-left: auto; }
        .chat-close:hover { color: var(--ivory); }
        .chat-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .chat-msgs::-webkit-scrollbar { width: 2px; }
        .chat-msgs::-webkit-scrollbar-thumb { background: var(--border); }
        .msg { display: flex; gap: 8px; max-width: 88%; animation: fadeMsg 0.2s ease; }
        @keyframes fadeMsg { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-av { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; margin-top: 2px; }
        .msg.bot .msg-av { background: linear-gradient(135deg, var(--teal), var(--gold)); color: var(--navy); font-weight: 600; }
        .msg.user .msg-av { background: rgba(212,168,83,0.2); border: 1px solid var(--border); color: var(--gold); font-size: 12px; }
        .msg-bubble { padding: 10px 14px; font-size: 13px; line-height: 1.6; }
        .msg.bot .msg-bubble { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--ivory); border-radius: 2px 8px 8px 8px; }
        .msg.user .msg-bubble { background: rgba(212,168,83,0.15); border: 1px solid rgba(212,168,83,0.25); color: var(--ivory); border-radius: 8px 2px 8px 8px; }
        .typing-wrap { display: flex; gap: 4px; align-items: center; padding: 8px 4px; }
        .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: tb 1s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes tb { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
        .suggestions { display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
        .sug-chip { font-size: 11px; padding: 5px 10px; border-radius: 2px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.2s; background: none; font-family: 'DM Sans'; }
        .sug-chip:hover { border-color: var(--gold); color: var(--gold); }
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .quick-action { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; cursor: pointer; font-size: 11px; color: var(--muted); font-family: 'DM Sans'; transition: all 0.2s; text-align: left; }
        .quick-action:hover { border-color: var(--teal); color: var(--teal); }
        .chat-input-row { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
        .chat-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; color: var(--ivory); font-family: 'DM Sans'; font-size: 13px; resize: none; outline: none; max-height: 80px; line-height: 1.5; transition: border-color 0.2s; }
        .chat-input::placeholder { color: rgba(248,244,238,0.3); }
        .chat-input:focus { border-color: rgba(212,168,83,0.4); }
        .chat-send { width: 38px; height: 38px; border-radius: 4px; background: var(--gold); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; color: var(--navy); font-size: 15px; }
        .chat-send:hover { background: var(--gold2); }
        .chat-send:disabled { background: rgba(212,168,83,0.3); cursor: not-allowed; }
        
        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(5,8,20,0.85); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(6px); animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { background: #0d1535; border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 480px; overflow: hidden; animation: slideUp 0.25s ease; }
        .modal-header { padding: 24px 28px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
        .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: var(--ivory); }
        .modal-pkg-sub { font-size: 12px; color: var(--teal); margin-top: 4px; letter-spacing: 1px; }
        .modal-body { padding: 24px 28px; }
        .form-group { margin-bottom: 18px; }
        .form-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px; }
        .form-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 2px; padding: 11px 14px; color: var(--ivory); font-family: 'DM Sans'; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: rgba(212,168,83,0.5); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .modal-footer { padding: 0 28px 24px; display: flex; gap: 12px; }
        .btn-cancel { flex: 1; background: none; border: 1px solid var(--border); color: var(--muted); padding: 12px; border-radius: 2px; font-family: 'DM Sans'; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-cancel:hover { border-color: var(--ivory); color: var(--ivory); }
        .btn-confirm { flex: 2; background: var(--gold); border: none; color: var(--navy); padding: 12px; border-radius: 2px; font-family: 'DM Sans'; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-confirm:hover { background: var(--gold2); }
        
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hiw-grid { grid-template-columns: 1fr; }
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .stats-bar { gap: 28px; }
            .chat-window { width: calc(100vw - 32px); right: 16px; }
            .search-bar { flex-direction: column; }
            .search-field { border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    {% verbatim %}
    <script type="text/babel">
        const CSRF_TOKEN = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
        const API_BASE = '/api';

        const destinations = [
            { id:1, name:"Santorini", country:"Greece", tags:["Island","Romantic"], rating:"4.9", bg:"#0d2840", emoji:"🏝️" },
            { id:2, name:"Kyoto", country:"Japan", tags:["Culture","Heritage"], rating:"4.8", bg:"#1e0d2a", emoji:"⛩️" },
            { id:3, name:"Machu Picchu", country:"Peru", tags:["Adventure","History"], rating:"4.9", bg:"#0d1e0d", emoji:"🏔️" },
            { id:4, name:"Amalfi Coast", country:"Italy", tags:["Coastal","Scenic"], rating:"4.7", bg:"#2a100d", emoji:"🌊" },
            { id:5, name:"Bali", country:"Indonesia", tags:["Tropical","Wellness"], rating:"4.8", bg:"#0d1e14", emoji:"🌿" },
            { id:6, name:"Maldives", country:"Indian Ocean", tags:["Luxury","Beach"], rating:"5.0", bg:"#0d1c2a", emoji:"🐠" },
        ];

        const packages = [
            { id:1, name:"Greek Islands Odyssey", dest:"Greece", duration:"10 Days", group:"2–8 pax", price:"2490", difficulty:"Easy", tag:"Bestseller", emoji:"🏛️", bg:"#0d1e2a" },
            { id:2, name:"Japan Cherry Blossom Trail", dest:"Japan", duration:"14 Days", group:"4–12 pax", price:"3850", difficulty:"Moderate", tag:"Seasonal", emoji:"🌸", bg:"#1a0d2a" },
            { id:3, name:"Andean Explorer", dest:"Peru & Bolivia", duration:"12 Days", group:"2–10 pax", price:"2990", difficulty:"Challenging", tag:"Adventure", emoji:"🦙", bg:"#0d1a0d" },
            { id:4, name:"Mediterranean Luxury Cruise", dest:"Italy & Croatia", duration:"8 Days", group:"2–6 pax", price:"4200", difficulty:"Easy", tag:"Luxury", emoji:"⛵", bg:"#1a0d0d" },
            { id:5, name:"Bali Spirit Journey", dest:"Indonesia", duration:"9 Days", group:"2–8 pax", price:"1890", difficulty:"Easy", tag:"Wellness", emoji:"🌺", bg:"#0d1a0d" },
            { id:6, name:"Maldives Overwater Retreat", dest:"Maldives", duration:"7 Days", group:"2 pax", price:"5600", difficulty:"Easy", tag:"Honeymoon", emoji:"🐚", bg:"#0d141e" },
        ];

        const testimonials = [
            { name:"Sophie Laurent", dest:"Santorini, Greece", text:"An absolutely transcendent experience. Every detail was curated to perfection — the sunsets, the food, the hidden coves.", rating:5, initials:"SL" },
            { name:"James Okafor", dest:"Kyoto, Japan", text:"Wanderlust unlocked a world I never knew existed. The cherry blossom season was nothing short of magical.", rating:5, initials:"JO" },
            { name:"Priya Sharma", dest:"Bali, Indonesia", text:"Every moment was intentional and soul-nourishing. I returned home completely transformed.", rating:5, initials:"PS" },
        ];

        const SUGGESTIONS = ["Best beach destinations?","Budget under $2000?","Honeymoon packages","Adventure tours"];

        function Wanderlust() {
            const [scrolled, setScrolled] = React.useState(false);
            const [chatOpen, setChatOpen] = React.useState(false);
            const [msgs, setMsgs] = React.useState([
                { role:"bot", text:"Welcome to Wanderlust ✦ I'm Aria, your personal travel concierge. Where shall we take you next?" }
            ]);
            const [input, setInput] = React.useState("");
            const [typing, setTyping] = React.useState(false);
            const [bookingPkg, setBookingPkg] = React.useState(null);
            const [form, setForm] = React.useState({ name:"", email:"", date:"", guests:"2" });
            const [success, setSuccess] = React.useState(false);
            const [nlEmail, setNlEmail] = React.useState("");
            const [nlDone, setNlDone] = React.useState(false);
            const msgsRef = React.useRef(null);

            React.useEffect(() => {
                const fn = () => setScrolled(window.scrollY > 40);
                window.addEventListener("scroll", fn);
                return () => window.removeEventListener("scroll", fn);
            }, []);

            React.useEffect(() => {
                if (msgsRef.current) msgsRef.current.scrollTop = msgsRef.current.scrollHeight;
            }, [msgs, typing]);

            const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior:"smooth" });

            const send = async (text) => {
                if (!text.trim() || typing) return;
                const t = text.trim();
                setInput("");
                setMsgs(prev => [...prev, { role:"user", text:t }]);
                setTyping(true);
                try {
                    const res = await fetch(`${API_BASE}/chat/`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF_TOKEN },
                        body: JSON.stringify({ message: t, history: msgs })
                    });
                    const data = await res.json();
                    setMsgs(prev => [...prev, { role:"bot", text:data.reply || "I'm having trouble connecting. Please try again." }]);
                } catch {
                    setMsgs(prev => [...prev, { role:"bot", text:"Connection issue. Please try again in a moment." }]);
                } finally {
                    setTyping(false);
                }
            };

            const confirmBooking = async () => {
                if (!form.name || !form.email || !form.date) return;
                try {
                    await fetch(`${API_BASE}/bookings/`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF_TOKEN },
                        body: JSON.stringify({ ...form, package_id: bookingPkg.id })
                    });
                    setSuccess(true);
                    setTimeout(() => { setBookingPkg(null); setSuccess(false); setForm({ name:"", email:"", date:"", guests:"2" }); }, 2800);
                } catch {
                    alert("Booking failed. Please try again.");
                }
            };

            const total = bookingPkg ? (parseInt(bookingPkg.price) * parseInt(form.guests)).toLocaleString() : 0;

            return (
                <>
                    {/* NAV */}
                    <nav className={`nav${scrolled ? " scrolled" : ""}`}>
                        <div className="nav-logo" onClick={() => scrollTo("hero")}>✦ Wanderlust</div>
                        <div className="nav-links">
                            {[["destinations","Destinations"],["packages","Packages"],["hiw","How It Works"],["testimonials","Reviews"]].map(([id,label]) => (
                                <span key={id} className="nav-link" onClick={() => scrollTo(id)}>{label}</span>
                            ))}
                        </div>
                        <div className="nav-btns">
                            <button className="btn-ghost" onClick={() => window.location.href = "/login"}>Sign In</button>
                            <button className="btn-gold" onClick={() => window.location.href = "/packages"}>Detailed Packages</button>
                        </div>
                    </nav>

                    {/* HERO */}
                    <section className="hero" id="hero">
                        <div className="hero-bg-orb" style={{ width:600, height:600, background:"rgba(0,180,166,0.06)", top:-100, right:-100 }} />
                        <div className="hero-bg-orb" style={{ width:400, height:400, background:"rgba(212,168,83,0.06)", bottom:0, left:-60 }} />
                        <div className="hero-eyebrow">Curated Luxury Travel Experiences</div>
                        <h1 className="hero-title">Discover the World<br /><em>Your Way</em></h1>
                        <p className="hero-sub">Handcrafted journeys to extraordinary destinations. Every detail perfected, every moment unforgettable.</p>
                        <div className="search-bar">
                            <div className="search-field">
                                <span className="search-label">Destination</span>
                                <input className="search-input" placeholder="Where do you dream?" />
                            </div>
                            <div className="search-field">
                                <span className="search-label">Travel Date</span>
                                <input className="search-input" type="date" style={{ colorScheme:"dark" }} />
                            </div>
                            <div className="search-field" style={{ borderRight:"none" }}>
                                <span className="search-label">Travelers</span>
                                <input className="search-input" placeholder="2 adults" />
                            </div>
                            <button className="search-btn" onClick={() => scrollTo("packages")}>🔍 Explore</button>
                        </div>
                        <div className="stats-bar">
                            {[["150+","Destinations"],["12K+","Happy Travelers"],["4.9★","Avg Rating"],["8yr","Experience"]].map(([n,l]) => (
                                <div key={l} className="stat-item">
                                    <div className="stat-num">{n}</div>
                                    <div className="stat-label">{l}</div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* DESTINATIONS */}
                    <section className="section" id="destinations">
                        <div className="section-header">
                            <div>
                                <div className="section-eyebrow">Where To Next</div>
                                <h2 className="section-title">Popular <em>Destinations</em></h2>
                            </div>
                            <span className="view-all" onClick={() => window.location.href = '/destinations'}>View All →</span>
                        </div>
                        <div className="dest-grid">
                            {destinations.map(d => (
                                <div key={d.id} className="dest-card">
                                    <div className="dest-emoji-bg" style={{ background:d.bg }}>{d.emoji}</div>
                                    <div className="dest-overlay" />
                                    <div className="dest-content">
                                        <div className="dest-country">{d.country}</div>
                                        <div className="dest-name">{d.name}</div>
                                        <div className="dest-meta">
                                            {d.tags.map(t => <span key={t} className="dest-tag">{t}</span>)}
                                            <span className="dest-rating">★ {d.rating}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* PACKAGES */}
                    <section className="section section-dark" id="packages">
                        <div className="section-header">
                            <div>
                                <div className="section-eyebrow">Curated Experiences</div>
                                <h2 className="section-title">Signature <em>Packages</em></h2>
                            </div>
                            <span className="view-all" onClick={() => window.location.href = '/packages'}>All Packages →</span>
                        </div>
                        <div className="pkg-grid">
                            {packages.map(p => (
                                <div key={p.id} className="pkg-card">
                                    <div className="pkg-img-wrap" style={{ background:p.bg }}>
                                        <div style={{ fontSize:60, opacity:0.75 }}>{p.emoji}</div>
                                        <div className="pkg-ribbon">From ${parseInt(p.price).toLocaleString()}</div>
                                        <div className="pkg-badge">{p.difficulty}</div>
                                    </div>
                                    <div className="pkg-body">
                                        <div className="pkg-dest">{p.dest}</div>
                                        <div className="pkg-name">{p.name}</div>
                                        <div className="pkg-info">
                                            <div className="pkg-info-item">🗓 {p.duration}</div>
                                            <div className="pkg-info-item">👥 {p.group}</div>
                                            <div className="pkg-info-item" style={{ marginLeft:"auto", color:"var(--teal)", fontSize:11, fontWeight:500 }}>{p.tag}</div>
                                        </div>
                                        <div className="pkg-footer">
                                            <div>
                                                <div className="pkg-price-label">Starting from</div>
                                                <div>
                                                    <span className="pkg-price-val">${parseInt(p.price).toLocaleString()}</span>
                                                    <span className="pkg-price-per"> / person</span>
                                                </div>
                                            </div>
                                            <button className="btn-book" onClick={() => setBookingPkg(p)}>Book Now</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* HOW IT WORKS */}
                    <section className="section" id="hiw">
                        <div className="section-header">
                            <div>
                                <div className="section-eyebrow">Simple Process</div>
                                <h2 className="section-title">How It <em>Works</em></h2>
                            </div>
                        </div>
                        <div className="hiw-grid">
                            <div className="hiw-connector" />
                            {[
                                { icon:"🔍", step:"Step 01", title:"Discover & Choose", desc:"Browse our curated collection and handcrafted packages tailored to your dream." },
                                { icon:"✦", step:"Step 02", title:"Personalize Your Journey", desc:"Work with our concierge to customize—accommodations, experiences, local guides." },
                                { icon:"✈️", step:"Step 03", title:"Travel With Confidence", desc:"24/7 support ensures a seamless, unforgettable journey from start to finish." }
                            ].map((s,i) => (
                                <div key={i} className="hiw-card">
                                    <div className="hiw-icon">{s.icon}</div>
                                    <div className="hiw-step">{s.step}</div>
                                    <div className="hiw-title">{s.title}</div>
                                    <p className="hiw-desc">{s.desc}</p>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* TESTIMONIALS */}
                    <section className="section section-dark" id="testimonials">
                        <div className="section-header">
                            <div>
                                <div className="section-eyebrow">Traveler Stories</div>
                                <h2 className="section-title">What Our Guests <em>Say</em></h2>
                            </div>
                        </div>
                        <div className="testi-grid">
                            {testimonials.map((t,i) => (
                                <div key={i} className="testi-card">
                                    <div className="testi-stars">{"★".repeat(t.rating)}</div>
                                    <p className="testi-text">"{t.text}"</p>
                                    <div className="testi-footer">
                                        <div className="testi-avatar">{t.initials}</div>
                                        <div>
                                            <div className="testi-name">{t.name}</div>
                                            <div className="testi-dest">✦ {t.dest}</div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* NEWSLETTER */}
                    <div className="newsletter">
                        <div className="section-eyebrow">Stay Inspired</div>
                        <div className="newsletter-title">Exclusive Deals &<br /><span style={{ fontFamily:"Cormorant Garamond,serif", fontStyle:"italic", color:"var(--gold)" }}>Destination Secrets</span></div>
                        <p className="newsletter-sub">Join 50,000+ travelers receiving curated guides and early-access offers.</p>
                        {!nlDone ? (
                            <div className="newsletter-form">
                                <input className="nl-input" placeholder="your@email.com" value={nlEmail} onChange={e => setNlEmail(e.target.value)} />
                                <button className="nl-btn" onClick={() => nlEmail && setNlDone(true)}>Subscribe</button>
                            </div>
                        ) : (
                            <div style={{ color:"var(--teal)", fontSize:15 }}>✓ You're subscribed! Welcome to Wanderlust.</div>
                        )}
                    </div>

                    {/* FOOTER */}
                    <footer className="footer">
                        <div className="footer-grid">
                            <div>
                                <div className="footer-logo">✦ Wanderlust</div>
                                <p className="footer-desc">Crafting extraordinary travel experiences since 2017. Every journey is a masterpiece.</p>
                                <div className="footer-social">
                                    {["f","ig","yt"].map(s => <div key={s} className="social-btn">{s}</div>)}
                                </div>
                            </div>
                            <div>
                                <div className="footer-col-title">Explore</div>
                                {["Destinations","Packages","Adventure Tours","Luxury Escapes","Honeymoon"].map(l => <a key={l} className="footer-link">{l}</a>)}
                            </div>
                            <div>
                                <div className="footer-col-title">Company</div>
                                {["About Us","Our Story","Careers","Press"].map(l => <a key={l} className="footer-link">{l}</a>)}
                            </div>
                            <div>
                                <div className="footer-col-title">Support</div>
                                {["Contact Us","FAQ","Booking Policy","Travel Insurance"].map(l => <a key={l} className="footer-link">{l}</a>)}
                            </div>
                        </div>
                        <div className="footer-bottom">
                            <span className="footer-copy">© 2026 Wanderlust. All rights reserved.</span>
                            <span className="footer-copy">Privacy · Terms · Cookies</span>
                        </div>
                    </footer>

                    {/* CHAT FAB */}
                    {!chatOpen && <div className="chat-fab-pulse" />}
                    <button className="chat-fab" onClick={() => setChatOpen(o => !o)}>
                        {chatOpen ? "✕" : "✦"}
                    </button>

                    {/* CHAT WINDOW */}
                    {chatOpen && (
                        <div className="chat-window">
                            <div className="chat-header">
                                <div className="chat-avatar">A</div>
                                <div style={{ flex:1 }}>
                                    <div className="chat-header-name">Aria — Travel Concierge</div>
                                    <div className="chat-header-status"><span className="status-dot" />Online · AI-Powered</div>
                                </div>
                                <button className="chat-close" onClick={() => setChatOpen(false)}>✕</button>
                            </div>

                            <div className="chat-msgs" ref={msgsRef}>
                                {msgs.map((m, i) => (
                                    <div key={i} className={`msg ${m.role}`}>
                                        <div className="msg-av">{m.role === "bot" ? "A" : "U"}</div>
                                        <div className="msg-bubble">
                                            {m.text}
                                            {i === 0 && (
                                                <div className="quick-actions">
                                                    {["🏖️ Beach escapes","🏔️ Adventure","💑 Honeymoon","🌿 Wellness"].map(q => (
                                                        <button key={q} className="quick-action" onClick={() => send(q)}>{q}</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                                {typing && (
                                    <div className="msg bot">
                                        <div className="msg-av">A</div>
                                        <div className="msg-bubble">
                                            <div className="typing-wrap">
                                                <div className="typing-dot" /><div className="typing-dot" /><div className="typing-dot" />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {msgs.length <= 2 && (
                                <div className="suggestions">
                                    {SUGGESTIONS.map(s => (
                                        <button key={s} className="sug-chip" onClick={() => send(s)}>{s}</button>
                                    ))}
                                </div>
                            )}

                            <div className="chat-input-row">
                                <textarea
                                    className="chat-input"
                                    placeholder="Ask about destinations..."
                                    rows={1}
                                    value={input}
                                    onChange={e => setInput(e.target.value)}
                                    onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input); } }}
                                />
                                <button className="chat-send" onClick={() => send(input)} disabled={typing || !input.trim()}>➤</button>
                            </div>
                        </div>
                    )}

                    {/* BOOKING MODAL */}
                    {bookingPkg && (
                        <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) setBookingPkg(null); }}>
                            <div className="modal">
                                <div className="modal-header">
                                    <div>
                                        <div className="modal-title">{success ? "✓ Booking Confirmed!" : "Reserve Your Journey"}</div>
                                        <div className="modal-pkg-sub">{bookingPkg.name} · {bookingPkg.duration}</div>
                                    </div>
                                    <button className="chat-close" onClick={() => setBookingPkg(null)}>✕</button>
                                </div>
                                {!success ? (
                                    <>
                                        <div className="modal-body">
                                            <div className="form-group">
                                                <label className="form-label">Full Name</label>
                                                <input className="form-input" placeholder="Your full name" value={form.name} onChange={e => setForm(p => ({ ...p, name:e.target.value }))} />
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Email Address</label>
                                                <input className="form-input" placeholder="your@email.com" value={form.email} onChange={e => setForm(p => ({ ...p, email:e.target.value }))} />
                                            </div>
                                            <div className="form-row">
                                                <div className="form-group" style={{ marginBottom:0 }}>
                                                    <label className="form-label">Travel Date</label>
                                                    <input className="form-input" type="date" style={{ colorScheme:"dark" }} value={form.date} onChange={e => setForm(p => ({ ...p, date:e.target.value }))} />
                                                </div>
                                                <div className="form-group" style={{ marginBottom:0 }}>
                                                    <label className="form-label">Guests</label>
                                                    <select className="form-input" value={form.guests} onChange={e => setForm(p => ({ ...p, guests:e.target.value }))}>
                                                        {[1,2,3,4,5,6,7,8].map(n => <option key={n} value={n}>{n} {n===1?"guest":"guests"}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div style={{ marginTop:20, padding:14, background:"rgba(212,168,83,0.08)", border:"1px solid rgba(212,168,83,0.2)", borderRadius:4 }}>
                                                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, color:"var(--muted)", marginBottom:6 }}>
                                                    <span>${parseInt(bookingPkg.price).toLocaleString()} × {form.guests} guests</span>
                                                    <span style={{ color:"var(--ivory)" }}>${total}</span>
                                                </div>
                                                <div style={{ display:"flex", justifyContent:"space-between", fontSize:15, fontWeight:500 }}>
                                                    <span style={{ color:"var(--gold)" }}>Total</span>
                                                    <span style={{ color:"var(--gold)", fontFamily:"Cormorant Garamond,serif", fontSize:22 }}>${total}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="modal-footer">
                                            <button className="btn-cancel" onClick={() => setBookingPkg(null)}>Cancel</button>
                                            <button className="btn-confirm" onClick={confirmBooking}>Confirm Booking</button>
                                        </div>
                                    </>
                                ) : (
                                    <div className="modal-body" style={{ textAlign:"center", padding:"44px 28px" }}>
                                        <div style={{ fontSize:52, marginBottom:16 }}>✈️</div>
                                        <div style={{ fontFamily:"Cormorant Garamond,serif", fontSize:22, color:"var(--ivory)", marginBottom:10 }}>Your adventure awaits!</div>
                                        <div style={{ fontSize:13, color:"var(--muted)" }}>Confirmation sent to {form.email}</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </>
            );
        }

        ReactDOM.render(<Wanderlust />, document.getElementById('root'));
    </script>
    {% endverbatim %}
</body>
</html>
